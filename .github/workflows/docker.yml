name: build-image

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/badggl/glacc-auto:0.3.0
            ghcr.io/badggl/glacc-auto:sha-${{ github.sha }}
            ghcr.io/badggl/glacc-auto:latest
          build-args: |
            GLACC_CLIENT_ID=${{ secrets.GLACC_CLIENT_ID }}
            GLACC_CLIENT_SECRET=${{ secrets.GLACC_CLIENT_SECRET }}
            GLACC_SIGN_KEY=${{ secrets.GLACC_SIGN_KEY }}
            CARGO_BUILD_JOBS=4
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false
