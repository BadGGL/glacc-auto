[package]
name = "glacc-auto"
version = "0.3.0"
edition = "2021"
rust-version = "1.80"
description = "glacc-auto headless service for Linux"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
md5 = "0.8"

# 平台替换：SHA-256 / 随机数 / 动态库加载
sha2 = "0.10"
rand = "0.8"
libloading = "0.8"
fs2 = "0.4"

# Web 服务
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 调度与时间
chrono = { version = "0.4", features = ["serde", "clock"] }
chrono-tz = "0.10"
cron = "0.12"

# Web 鉴权
argon2 = "0.5"
hmac = "0.12"
base64 = "0.22"
subtle = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
