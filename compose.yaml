services:
  glacc:
    build:
      context: .
      args:
        GLACC_CLIENT_ID: ${GLACC_CLIENT_ID:-}
        GLACC_CLIENT_SECRET: ${GLACC_CLIENT_SECRET:-}
        GLACC_SIGN_KEY: ${GLACC_SIGN_KEY:-}
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: glacc-auto:0.3.0
    container_name: glacc-auto
    restart: unless-stopped
    ports:
      - "${GLACC_BIND:-0.0.0.0}:${GLACC_PORT:-8080}:8080"
    environment:
      GLACC_PASSWORD: ${GLACC_PASSWORD:?请在 .env 中设置 GLACC_PASSWORD}
      GLACC_LISTEN: 0.0.0.0:8080
      GLACC_DATA_DIR: /data
      GLACC_WEB_DIR: /app/web/dist
      GLACC_TLS_LIB: /app/lib/libtls-client.so
      GLACC_COOKIE_SECURE: ${GLACC_COOKIE_SECURE:-false}
      GLACC_TRUST_PROXY: ${GLACC_TRUST_PROXY:-false}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - glacc-data:/data
      - ./lib:/app/lib:ro
    security_opt:
      - no-new-privileges:true

volumes:
  glacc-data:
